<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vue Joueur - QuEazy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.socket.io" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <meta name="theme-color" content="#0a0a1f" />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" defer></script>
  </head>
  <body class="display-body">
    <!-- Page volontairement minimale (tâche 040) : PAS de navbar, PAS de
         profil, PAS de confetti — juste la question projetée. Contrairement
         à index.html (interface hôte complète), cette page n'a rien à
         montrer d'autre qu'un écran de jeu en lecture seule. Classes de
         base réutilisées telles quelles (.question-text/.illustration-img/
         .options-grid/.option-btn, voir style.css) pour la cohérence
         visuelle avec l'écran de jeu MJ — seule la mise en page plein écran
         (bloc CSS scopé à body.display-body) diffère. -->
    <div id="displayRoot" class="display-root">
      <div id="displayWaiting" class="display-waiting">En attente du début de la partie…</div>

      <div id="displayContent" class="display-content d-none">
        <img id="displayIllustration" class="illustration-img d-none" alt="" draggable="false" />
        <div id="displayPrompt" class="question-text"></div>
        <div id="displayOptions" class="options-grid d-none"></div>
      </div>

      <button type="button" id="displayFullscreenBtn" class="btn display-fullscreen-btn">⛶ Plein écran</button>
    </div>

    <script src="/js/display.js" defer></script>
  </body>
</html>
