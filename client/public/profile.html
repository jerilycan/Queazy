<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuEazy – Profil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuEazy" />
    <script src="/js/pwa.js" defer></script>
    <script src="/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/js/supabase-config.js" defer></script>
  </head>
  <body>
    <div class="navbar">
      <a href="/" class="brand">QuEazy</a>
      <div class="nav-group">
        <a href="/?create=true" id="navCreate" class="btn btn-nav-main">Créer</a>
        <a href="/?join=true" id="navJoin" class="btn btn-nav-main">Rejoindre</a>
      </div>
      <div class="nav-group">
        <a href="/select.html" class="btn btn-nav-secondary">Mes Quiz</a>
        <a id="navLogin" href="/login.html" class="btn btn-nav-secondary d-none">Connexion</a>
        <a id="profile" href="/profile.html" class="profile-chip d-none">
          <span id="profileAvatar" class="avatar-profile-link"></span>
          <span id="profileName" class="profile-name"></span>
        </a>
      </div>
    </div>

    <div class="container mt-20">

      <h1 class="mb-lg">Mon Profil</h1>

      <div class="card">
        <div class="profile-layout d-flex gap-lg align-start">
          <div id="avatar" class="avatar-main avatar-lg flex-shrink-0 avatar-profile"></div>
          <div class="flex-1 d-flex flex-column gap-md">
            <div>
              <label class="d-block font-14 font-bold text-muted mb-8">Pseudo</label>
              <input id="name" placeholder="Ton pseudo" maxlength="20" />
            </div>
            
            <div>
              <label class="d-block font-14 font-bold text-muted mb-8">Avatar</label>
              <div class="icon-grid" id="avatarGrid"></div>
            </div>

            <button id="save" class="btn btn-primary h-50 mt-8">Sauvegarder le profil</button>
            <button id="logout" class="btn border-danger text-danger h-50 mt-8">Se déconnecter</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toasts" class="toast-container"></div>

    <script src="/js/profile.js" defer></script>
  </body>
</html>
