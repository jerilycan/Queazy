<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Résultats - QuEazy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://cdn.socket.io" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/js/supabase-config.js" defer></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
  </head>
  <body>
    <div class="navbar">
      <a href="/" class="brand">QuEazy</a>
      <div class="nav-group">
        <a href="/select.html" class="btn btn-nav-secondary">Mes Quiz</a>
      </div>
      <div class="nav-group">
        <a id="navLogin" href="/login.html" class="btn btn-nav-secondary d-none">Connexion</a>
        <a id="profile" href="/profile.html" class="profile-chip d-none">
          <span id="profileAvatar" class="avatar-profile-link"></span>
          <span id="profileName" class="profile-name"></span>
        </a>
      </div>
    </div>

    <div class="container mt-20">
      <div class="card max-w-700 m-auto text-center">
        <h1 class="font-32 mb-md">🏆 Résultats finaux 🏆</h1>
        <div id="resultsPodium" class="podium-container m-auto mb-lg" style="max-width:540px">
          <div class="podium-step step-2 hidden">
            <div class="podium-avatar"></div>
            <div class="podium-name text-dark font-bold mb-8"></div>
            <div class="podium-bar bg-accent-light">
              <span class="text-white font-24 font-bold">2</span>
            </div>
            <div class="podium-score text-accent font-bold mt-8"></div>
          </div>
          <div class="podium-step step-1 hidden">
            <div class="podium-crown">👑</div>
            <div class="podium-avatar"></div>
            <div class="podium-name text-dark font-bold mb-8"></div>
            <div class="podium-bar bg-accent">
              <span class="text-white font-32 font-bold">1</span>
            </div>
            <div class="podium-score text-accent font-bold mt-8"></div>
          </div>
          <div class="podium-step step-3 hidden">
            <div class="podium-avatar"></div>
            <div class="podium-name text-dark font-bold mb-8"></div>
            <div class="podium-bar bg-accent-light">
              <span class="text-white font-24 font-bold">3</span>
            </div>
            <div class="podium-score text-accent font-bold mt-8"></div>
          </div>
        </div>
        <div id="fullTable" class="mt-lg"></div>
        <div style="margin-top:48px">
          <button id="backHome" class="btn btn-primary px-32 py-12 font-18">Retour à l'accueil</button>
        </div>
      </div>
    </div>

    <script src="/js/results.js" defer></script>
  </body>
</html>
