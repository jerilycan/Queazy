<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuEazy – Sélection de Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuEazy" />
    <script src="/js/pwa.js" defer></script>
    <script src="/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/js/supabase-config.js" defer></script>
  </head>
  <body>
    <div class="navbar">
      <a href="/" class="brand">
        <span class="brand-logo-wrap">
          <img src="/icons/queazy-wordmark.png" alt="QuEazy" class="brand-logo" />
          <svg class="brand-sprite brand-sprite-pin" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="brand-sprite-pin-fill" d="M12 2c-4.4 0-8 3.5-8 7.8 0 5.8 8 12.2 8 12.2s8-6.4 8-12.2C20 5.5 16.4 2 12 2z" />
            <circle cx="12" cy="9.8" r="2.6" fill="#0a0a1f" />
          </svg>
          <svg class="brand-sprite brand-sprite-note" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect class="brand-sprite-note-fill" x="13.2" y="3" width="1.8" height="12" rx="0.9" />
            <path class="brand-sprite-note-fill" d="M15 3l5 1.6v3L15 6.2z" />
            <ellipse class="brand-sprite-note-fill" cx="10.5" cy="16.5" rx="3.5" ry="2.6" transform="rotate(-18 10.5 16.5)" />
          </svg>
          <svg class="brand-sprite brand-sprite-dot" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle class="brand-sprite-dot-fill" cx="12" cy="12" r="6" />
          </svg>
          <svg class="brand-sprite brand-sprite-tri" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="brand-sprite-tri-stroke" d="M12 3 L21 20 L3 20 Z" fill="none" stroke-width="2" stroke-linejoin="round" />
          </svg>
        </span>
      </a>
      <div class="nav-group">
        <a href="/?create=true" id="navCreate" class="btn btn-nav-main">Créer</a>
        <a href="/?join=true" id="navJoin" class="btn btn-nav-main">Rejoindre</a>
      </div>
      <div class="nav-group">
        <a href="/select.html" class="btn btn-nav-secondary">Mes Quiz</a>
        <a id="navLogin" href="/login.html" class="btn btn-nav-secondary d-none">Connexion</a>
        <a id="profile" href="/profile.html" class="profile-chip d-none">
          <span id="profileAvatar" class="avatar-profile-link"></span>
          <span id="profileName" class="profile-name"></span>
        </a>
      </div>
    </div>

    <div class="container mt-20">
      
      <div class="select-header d-flex justify-between align-center mb-lg">
        <div class="select-header-tabs d-flex gap-sm">
          <button id="tabMine" class="btn btn-primary">Mes Quiz</button>
          <button id="tabPublic" class="btn">Quiz publics</button>
        </div>
        <a href="/editor.html" id="newQuizBtn" class="btn btn-primary"><span>+</span> Nouveau Quiz</a>
      </div>
      
      <div id="list" class="player-grid select-grid">
        <!-- Liste des quiz -->
      </div>
    </div>
    <script src="/js/select.js" defer></script>
  </body>
</html>
